      - generic [ref=f6e230]: La narrativa
      - text: Una venta no es el final, es el inicio de la relación. La gestión del CLV y los programas de lealtad te mostraron cómo hacer crecer y retener al cliente; el pipeline, las tareas y la posventa del CRM lo ejecutan día a día, para que ningún cliente se enfríe ni ninguna oportunidad se quede en el olvido.
