  - generic [ref=f6e272]:
    - generic [ref=f6e273]: El enemigo silencioso
    - generic [ref=f6e274]: Los “silos de información” destruyen la relación con el cliente
    - generic [ref=f6e275]:
      - generic [ref=f6e276]: "En el aula lo nombraste: cuando soporte no sabe lo que ventas prometió en redes, o mercadeo no ve lo que pasó en servicio, la experiencia se quiebra y la confianza se pierde."
      - generic [ref=f6e278]: "El CRM lo resuelve: una sola base compartida. Todas las áreas ven la misma historia del cliente — mercadeo, ventas y servicio en sintonía."
    - paragraph [ref=f6e280]: "El CRM no reemplaza la filosofía relacional: la hace posible a escala, rompiendo los silos que en el papel no se ven pero en la operación sí duelen."
