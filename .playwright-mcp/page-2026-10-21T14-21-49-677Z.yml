  - generic [ref=f6e14]:
    - generic [ref=f6e15]: Introducción
    - generic [ref=f6e16]: "Del aula a la operación: qué van a ver hoy"
    - generic [ref=f6e17]: Durante el curso construyeron una estrategia de Mercadeo Relacional. Hoy vamos a ver dónde esa estrategia cobra vida y se vuelve el trabajo de todos los días.
    - generic [ref=f6e18]:
      - generic [ref=f6e19]:
        - generic [ref=f6e20]: 1 · DE DÓNDE VENIMOS
        - heading "El conocimiento del aula" [level=4] [ref=f6e21]
        - paragraph [ref=f6e22]: "Conceptos, marcos y entregables: conocer al cliente, segmentar por valor (RFM, CLV), fidelizar y medir. La teoría que da criterio."
      - generic [ref=f6e23]:
        - generic [ref=f6e24]: 2 · A DÓNDE VAMOS
        - heading "La experiencia del trabajo diario" [level=4] [ref=f6e25]
        - paragraph [ref=f6e26]: "Esos conceptos dejan de ser un taller y se convierten en acciones concretas dentro de un CRM: fichas, oportunidades, tareas e indicadores vivos."
      - generic [ref=f6e27]:
        - generic [ref=f6e28]: 3 · QUÉ ESPERAMOS
        - heading "Después de este demo" [level=4] [ref=f6e29]
        - paragraph [ref=f6e30]: Que entiendan cómo su conocimiento se aplica y genera valor en una empresa real, y que vean el CRM como el lugar donde el mercadeo se gestiona, no se archiva.
    - generic [ref=f6e31]: "En una frase: hoy pasamos de “lo aprendí” a “lo veo funcionando”. La meta no es memorizar una herramienta, sino comprender cómo la relación con el cliente se mantiene viva, registrada y medible todos los días."
