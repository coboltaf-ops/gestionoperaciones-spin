  - generic [ref=f6e77]:
    - generic [ref=f6e78]: La gran idea
    - paragraph [ref=f6e79]: El Mercadeo Relacional es la filosofía.El CRM es donde esa filosofía se vuelve operación, todos los días.
    - paragraph [ref=f6e80]: La teoría no puede quedarse en el brief. La confianza, la segmentación, la fidelización y las métricas necesitan un lugar donde vivir, registrarse y medirse a diario. Ese lugar es el CRM. A eso le llamamos Mercadeo al Día.
    - paragraph [ref=f6e81]: “El Mercadeo Relacional no es un software (CRM), es una filosofía de negocios de largo plazo…” — Memorias del curso, Entregable 0. El CRM es la herramienta que la operacionaliza.
