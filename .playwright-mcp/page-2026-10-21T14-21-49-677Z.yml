  - generic [ref=f6e124]:
    - generic [ref=f6e125]: Puente 1 · Conocer al cliente
    - generic [ref=f6e126]: Del Brief Relacional… a la ficha 360° del cliente
    - generic [ref=f6e127]:
      - generic [ref=f6e128]:
        - generic [ref=f6e129]: En el aula
        - heading "El Brief Relacional" [level=3] [ref=f6e130]
        - paragraph [ref=f6e131]: Diagnosticar el negocio, el comprador y sus canales. Alinear los objetivos de la empresa con las necesidades reales del cliente.
        - list [ref=f6e132]:
          - listitem [ref=f6e133]: ¿Quién es el cliente y qué valora?
          - listitem [ref=f6e134]: ¿Por qué canales se relaciona?
          - listitem [ref=f6e135]: Datos cualitativos y cuantitativos de entrada.
      - generic [ref=f6e136]:
        - generic [ref=f6e137]: En el CRM
        - heading "Clientes y Contactos" [level=3] [ref=f6e138]
        - paragraph [ref=f6e139]: Toda esa información deja de estar en una presentación y vive en una ficha única y viva, consultable por todo el equipo.
        - list [ref=f6e140]:
          - listitem [ref=f6e141]: Empresa, personas, actividad, ubicación, situación (prospecto · cliente).
          - listitem [ref=f6e142]: "Varios contactos por empresa: decisores e interlocutores."
          - listitem [ref=f6e143]: Una sola fuente de verdad, sin datos duplicados.
    - generic [ref=f6e144]:
      - generic [ref=f6e145]: La narrativa
      - text: "En clase aprendiste a diagnosticar quién es el cliente y qué valora. En la empresa ese conocimiento no puede vivir en la cabeza de una sola persona ni en un documento que se archiva: el CRM lo convierte en una ficha viva que todo el equipo consulta y enriquece cada día. Conocer al cliente deja de ser un ejercicio académico y se vuelve un hábito operativo."
    - generic [ref=f6e146]:
      - generic [ref=f6e147]: Mercadeo al Día · del aula a la operación
      - img "JP" [ref=f6e149]
  - generic [ref=f6e150]:
    - generic [ref=f6e151]: Puente 2 · Auditar la relación
    - generic [ref=f6e152]: Del Customer Journey y la Voz del Cliente… a la bitácora y las PQRS
    - generic [ref=f6e153]:
      - generic [ref=f6e154]:
        - generic [ref=f6e155]: En el aula
        - heading "Auditoría Relacional" [level=3] [ref=f6e156]
        - paragraph [ref=f6e157]: "Mapear los puntos de contacto, detectar fricciones y escuchar la Voz del Cliente. Un gran enemigo: los silos de información."
        - list [ref=f6e158]:
          - listitem [ref=f6e159]: ¿Dónde se gana o se pierde la confianza?
          - listitem [ref=f6e160]: ¿El mensaje es coherente en todos los canales?
          - listitem [ref=f6e161]: Quejas y sugerencias como oportunidades de mejora.
      - generic [ref=f6e162]:
        - generic [ref=f6e163]: En el CRM
        - heading "Bitácora + PQRS" [level=3] [ref=f6e164]
        - paragraph [ref=f6e165]: Cada contacto, llamada, correo y reclamo queda registrado y trazable, sin importar el canal ni el área.
        - list [ref=f6e166]:
          - listitem [ref=f6e167]: Bitácora cronológica por cliente y oportunidad.
          - listitem [ref=f6e168]: "PQRS por tipo, prioridad y estado: ningún caso sin atender."
          - listitem [ref=f6e169]: La información deja de quedar atrapada en un solo departamento.
    - generic [ref=f6e170]:
      - generic [ref=f6e171]: La narrativa
      - text: "Auditar la relación es, ante todo, escuchar: entender dónde se gana la confianza y dónde se rompe. El Customer Journey te enseñó a mapear esos momentos; la bitácora y las PQRS del CRM los capturan en tiempo real —llamada a llamada, reclamo a reclamo—. Así la Voz del Cliente deja de perderse en correos sueltos y se vuelve mejora continua."
    - generic [ref=f6e172]:
      - generic [ref=f6e173]: Qué significan
      - generic [ref=f6e174]: PQRS = Peticiones, Quejas, Reclamos y Sugerencias.
      - generic [ref=f6e175]: Customer Journey = mapa del recorrido del cliente, punto de contacto por punto de contacto.
      - generic [ref=f6e176]: Silos = información encerrada en un área, que no ven las demás.
    - generic [ref=f6e177]:
      - generic [ref=f6e178]: Mercadeo al Día · del aula a la operación
      - img "JP" [ref=f6e180]
  - generic [ref=f6e181]:
    - generic [ref=f6e182]: Puente 3 · Segmentar por valor
    - generic [ref=f6e183]: De RFM y CLV… a priorizar a quién dedicarle esfuerzo
    - generic [ref=f6e184]:
      - generic [ref=f6e185]:
        - generic [ref=f6e186]: En el aula
        - heading "RFM & Customer Lifetime Value" [level=3] [ref=f6e187]
        - paragraph [ref=f6e188]: No todos los clientes valen lo mismo. Se clasifican por Recencia, Frecuencia y Monto y por su valor en el tiempo (CLV).
        - list [ref=f6e189]:
          - listitem [ref=f6e190]: Los recursos van a los segmentos de mayor rentabilidad y potencial.
          - listitem [ref=f6e191]: Se abandonan las promociones masivas ineficientes.
      - generic [ref=f6e192]:
        - generic [ref=f6e193]: En el CRM
        - heading "Datos que permiten segmentar" [level=3] [ref=f6e194]
        - paragraph [ref=f6e195]: El historial de cotizaciones, montos y frecuencia da la materia prima para clasificar y enfocar el esfuerzo comercial.
        - list [ref=f6e196]:
          - listitem [ref=f6e197]: Clientes por valor, pipeline con monto y probabilidad.
          - listitem [ref=f6e198]: Filtros y reportes para enfocar campañas y seguimiento.
          - listitem [ref=f6e199]: Decisiones con datos reales, no con intuición.
    - generic [ref=f6e200]:
      - generic [ref=f6e201]: La narrativa
      - text: "Tratar a todos los clientes igual es desperdiciar recursos. RFM y CLV te dieron el criterio para diferenciarlos por su valor; el CRM te da los datos reales —compras, montos y frecuencia— para aplicarlo. El resultado es simple pero poderoso: el esfuerzo comercial se concentra donde de verdad rinde."
    - generic [ref=f6e202]:
      - generic [ref=f6e203]: Qué significan
      - generic [ref=f6e204]: RFM = Recencia (hace cuánto compró), Frecuencia (cada cuánto) y Monto (cuánto gasta).
      - generic [ref=f6e205]: "CLV = Customer Lifetime Value: el valor total de un cliente a lo largo de toda su relación."
    - generic [ref=f6e206]:
      - generic [ref=f6e207]: Mercadeo al Día · del aula a la operación
      - img "JP" [ref=f6e209]
